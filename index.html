<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XRG – Valorant</title>
<style>
:root{--bg:#000;--panel:#0d0d10;--hd:#16161a;--line:#26262c;--text:#dfe4ec;--mute:#7f8a9a;--acc:#a566ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#000;--panel:#0d0d10;--hd:#16161a;--line:#26262c;--text:#dfe4ec;--mute:#7f8a9a;--acc:#a566ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:0 20px;overflow-x:auto}
.brand{font-weight:700;font-size:17px;letter-spacing:.06em;padding:14px 0}
nav{display:flex;gap:4px}
nav a{padding:16px 12px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);border-color:var(--acc)}
a:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
main{max-width:1080px;margin:0 auto;padding:28px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:22px;font-weight:650;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:20px}
h2{font-size:13px;font-weight:600;margin:0;padding:11px 16px;background:var(--hd);border-bottom:1px solid var(--line);color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.nm{font-weight:600}
.role{color:var(--mute);margin-left:auto;text-align:right}
.fl{width:22px;height:15px;flex:none;border:1px solid var(--line);display:inline-block;overflow:hidden;line-height:0}
.fl svg{width:100%;height:100%;display:block}
.fl.t{font-size:9px;line-height:13px;text-align:center;color:var(--mute)}
.logo{width:56px;height:56px;border:1px solid var(--line);background:var(--hd);display:grid;place-items:center;font-weight:700;color:var(--mute);flex:none;overflow:hidden}
.logo.s{width:34px;height:34px;font-size:11px}
.logo img{width:100%;height:100%;object-fit:contain}
.head{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.head h1{margin:0}
.empty{padding:26px 16px;color:var(--mute)}
.tx{display:grid;grid-template-columns:90px 110px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.tx .d{color:var(--mute)}
.tx .k{font-weight:600}
.stat{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);color:var(--mute)}
.stat b{color:var(--text);font-weight:600}
.logo{background:transparent;border:0}.logo img{padding:5px}.scroll{overflow-x:auto}
.tr{display:grid;grid-template-columns:104px 70px minmax(150px,1fr) 80px 56px;gap:12px;padding:11px 16px;border-top:1px solid var(--line);align-items:center;min-width:540px}
.tr.th{color:var(--mute);font-weight:600;font-size:12px;border-top:0}
.tr .d{color:var(--mute)}.j{color:#2fa36b;font-weight:600}.l{color:#d4505a;font-weight:600}
.nmf{display:flex;align-items:center;gap:10px}.fl.ph{border:0}
.code{font-weight:600;color:var(--mute);letter-spacing:.04em;font-size:.8em}a.code:hover{color:var(--text)}
#hero{max-width:1080px;margin:0 auto;padding:28px 20px 0}#hero h1{font-size:28px}
.gif img{width:100%;display:block;max-height:460px;object-fit:contain;background:#000;border:1px solid var(--line);border-radius:3px}
main.one{grid-template-columns:1fr;max-width:820px}main.one aside{display:none}
.mt{display:grid;grid-template-columns:96px minmax(110px,1fr) 64px minmax(110px,1fr) minmax(120px,1.2fr);gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);min-width:580px}
.mt .sc{text-align:center;font-weight:700}.mt .ev{color:var(--mute);text-align:right}.mt .d{color:var(--mute)}
.stxs{max-height:760px;overflow-y:auto}.stx{padding:10px 16px;border-top:1px solid var(--line)}.stx:first-child{border-top:0}
.sd{color:var(--mute);font-size:12px;margin-top:2px;padding-left:32px}.es{color:var(--mute);font-size:12px}
.logo.xs{width:22px;height:22px;font-size:8px}.logo.ph{background:var(--hd);border:1px solid var(--line);font-size:11px}
.hlogo{height:72px;width:auto;display:block;margin-bottom:10px}
main.one{max-width:980px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--tc,var(--acc))}button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.mr{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(130px,1fr) 72px minmax(130px,1fr) 100px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);min-width:720px}
.mr:first-child{border-top:0}.me,.mt2{display:flex;align-items:center;gap:10px}.mt1{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-align:right}
.sbox{align-self:stretch;display:grid;place-items:center;margin:-10px 0;color:#fff;font-weight:700;font-size:15px}.sbox.w{background:#2f7d58}.sbox.x{background:#8a4a4f}
.mx{text-align:right}.mx .es{margin-top:4px}
.btn{display:inline-block;background:var(--hd);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:3px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}.btn:hover{border-color:var(--acc)}
.rec{display:flex;gap:48px;padding:16px;flex-wrap:wrap}.rv{font-size:22px;font-weight:700}.mf{padding:10px 16px;border-top:1px solid var(--line)}
.logo.s img{padding:3px}
.soc{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.brand{padding:10px 0;display:flex;align-items:center}.brand img{height:30px;width:auto;display:block}
.mini{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px}.mp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}.mini .fl{width:16px;height:11px}
#hero.full{max-width:none;margin:0;padding:0;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hshade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.25) 45%,rgba(0,0,0,.8))}
.hc{position:relative;text-align:center;padding:0 20px}
.hlogo2{height:clamp(70px,13vw,150px);width:auto;max-width:82vw;display:block;margin:0 auto 16px;filter:brightness(1.8) drop-shadow(0 4px 24px rgba(0,0,0,.6))}
.hc p{margin:0;color:#dfe4ec;font-size:clamp(13px,1.8vw,17px);letter-spacing:.1em;text-transform:uppercase}
.scrollcue{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:none;border:0;color:#dfe4ec;font:600 12px inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.85}
#hero.full{justify-content:flex-start}
.hc{text-align:left;padding:0 max(24px,7vw)}
.hlogo2{margin:0 0 20px}
.h1t{font-size:clamp(22px,3.4vw,40px);font-weight:700;letter-spacing:.04em;line-height:1.15}
.h2t{margin-top:6px;color:var(--mute);font-size:clamp(12px,1.6vw,16px);letter-spacing:.22em}
.hshade{background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.12) 65%),linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,0) 50%,rgba(0,0,0,.7))}
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.enter{animation:pgIn .42s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .5s ease both}
#view,#side,#hero{transition:opacity .16s ease,transform .16s ease}
#view.leave,#side.leave{opacity:0;transform:translateY(-6px)}
#hero.leave{opacity:0}
@media (prefers-reduced-motion:reduce){.enter,.fade{animation:none}#view,#side,#hero{transition:none}}
.news{display:grid;grid-template-columns:300px 1fr;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.news img,.phimg{width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.phimg{background:var(--hd);display:grid;place-items:center;color:var(--mute)}
.nb{padding:18px 20px 18px 0}.nd{color:var(--mute);font-size:12px;margin-bottom:6px}.nb h3{margin:0 0 8px;font-size:17px}.nb p{margin:0;white-space:pre-line}.news.pv{opacity:.55}
.btn:hover{border-color:var(--tc,var(--acc))}
@media(max-width:640px){.news{grid-template-columns:1fr;gap:0}.nb{padding:14px 16px 16px}}
.notice{margin:-6px 0 18px;padding:9px 14px;border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));background:var(--panel);color:var(--mute);font-size:13px}
</style></head><body>

const heroHtml=()=>`<video class="hv" autoplay muted loop playsinline preload="auto" poster="${POSTER}" src="${VID}"></video><div class="hshade"></div><div class="hc"><img class="hlogo2" src="${HLOGO}" alt="XRG"><div class="h1t">XRG Esports</div><div class="h2t">EST - 2026</div></div><button class="scrollcue">Scroll</button>`;
const fit=()=>{const e=document.getElementById("hero");e.style.height=e.classList.contains("full")?Math.max(380,innerHeight-document.querySelector("header").offsetHeight)+"px":""};
addEventListener("resize",fit);
function heroGo(H){const e=document.getElementById("hero");e.className=H?"full fade":"fade";e.innerHTML=H?heroHtml():"";fit();if(H){const c=e.querySelector(".scrollcue");c.onclick=()=>document.querySelector("main").scrollIntoView({behavior:"smooth"});const v=e.querySelector("video");v.muted=true;const p=v.play();if(p&&p.catch)p.catch(()=>{})}}
const formerCard=()=>`<div class="card"><h2>Former teams</h2>${old.map(i=>{const t=DATA.teams[i];return `<a class="row" href="#${i}">${logo(t,1)}<div><div class="nm">${t.name}</div><div class="es">${fmtR(t.start,t.end)}</div></div><span class="role code">${t.code}</span></a>`}).join("")}</div>`;
function homeMain(){return homeMain0()+formerCard()}
function homeMain0(){return `<div class="card"><h2>Ongoing events</h2>${evRows(cur.flatMap(evList).filter(e=>e.s==="Ongoing"),"No events are happening right now.")}</div>
<div class="card"><h2>Current teams</h2>${cur.map(i=>{const t=DATA.teams[i];return `<a class="row" href="#${i}">${logo(t,1)}<div><div class="nm">${t.name}</div><div class="mini">${t.players.map(p=>`<span class="mp">${flag(p[1])}${p[0]}</span>`).join("")}</div></div><span class="role code">${t.code}</span></a>`}).join("")}</div>`}
const SOC=[["X",""],["Instagram",""],["YouTube",""],["Twitch",""],["Discord",""],["TikTok",""]];
const socCard=()=>`<div class="card"><h2>Socials</h2><div class="soc">${SOC.map(s=>s[1]?`<a class="btn" href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`:`<button class="btn">${s[0]}</button>`).join("")}</div>${SOC.some(s=>s[1])?"":'<div class="es" style="padding:0 16px 14px">Links coming soon.</div>'}</div>`;
const sideTx=()=>socCard()+`<div class="card"><h2>Roster Moves <a class="code" style="float:right" href="#roster-moves">View all</a></h2><div class="stxs">${byDate(DATA.tx).slice(0,7).map(x=>{const a=ACT[x[1]];return `<div class="stx"><div class="nmf">${nameCell(x)}<span class="nm">${x[2]}</span><span class="role code">${DATA.teams[x[4]].code}</span></div><div class="sd"><span class="${a[1]}">${a[0]}</span> · ${x[3]} · ${fmt(x[0])}</div></div>`}).join("")}</div></div>`;
function team(id){const t=DATA.teams[id],ms=M(id);let b;
 if(tab==="matches")b=rec(ms)+`<div class="card scroll"><h2>Matches</h2>${mList(ms)}</div>`;
 else if(tab==="events")b=`<div class="card"><h2>Events</h2>${evRows(evList(id),"No events yet.")}</div>`;
 else if(tab==="transactions")b=`<div class="card scroll"><h2>Roster Moves</h2>${txTable(DATA.tx.filter(x=>x[4]===id))}</div>`;
 else b=rec(ms)+`<div class="card"><h2>Players</h2>${t.players.map(p=>`<div class="row">${flag(p[1])}<span class="nm">${p[0]}</span><span class="role">Player</span></div>`).join("")||'<div class="empty">No players listed.</div>'}</div>
 <div class="card"><h2>Staff</h2>${t.staff.map(p=>`<div class="row">${flag(p[2])}<span class="nm">${p[0]}</span><span class="role">${p[1]}</span></div>`).join("")||'<div class="empty">No staff listed.</div>'}</div>`;
 return `<div class="head">${logo(t)}<div><h1>${t.name} <span class="code">${t.code}</span></h1><div class="sub" style="margin:0">${t.game}${t.end?" · Former team · "+fmtR(t.start,t.end):""}</div></div></div>${t.note?`<div class="notice">${t.note}</div>`:""}<div class="tabs">${[["overview","Roster"],["matches","Matches"],["events","Events"],["transactions","Roster Moves"]].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n}</button>`).join("")}</div>${b}`}
/* News: [date, title (optional), text, image] */
const NEWS=[];
const newsPage=()=>`<h1>News</h1><p class="sub">Latest from XRG Esports.</p>`+(NEWS.length?byDate(NEWS).map(n=>`<article class="news">${n[3]?`<img src="${n[3]}" alt="">`:""}<div class="nb"><div class="nd">${fmt(n[0])}</div>${n[1]?`<h3>${n[1]}</h3>`:""}<p>${n[2]}</p></div></article>`).join(""):`<article class="news pv"><div class="phimg">Image</div><div class="nb"><div class="nd">Date</div><p>News will appear here, newest first.</p></div></article>`);
const noteLine=()=>{const n=ids.filter(i=>DATA.teams[i].note).map(i=>DATA.teams[i].name);return n.length?`<p class="es" style="margin-top:12px">Some information for ${n.join(", ")} may not be accurate.</p>`:""};
const movesPage=()=>`<h1>Roster Moves</h1><p class="sub">Player and staff moves, team creations and disbandments across the organization.</p><div class="card scroll"><h2>Roster Moves</h2>${txTable(DATA.tx)}</div>${noteLine()}`;
function go(){document.getElementById("brandimg").src=LOGO.xrg;const h=(location.hash||"#home").slice(1),k=DATA.teams[h]||h==="roster-moves"||h==="news"?h:"home",H=k==="home";onHome=H;
 heroGo(H);
 document.getElementById("view").innerHTML=H?homeMain():k==="roster-moves"?movesPage():k==="news"?newsPage():team(k);
